repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

  # Это блок для mypy. Убедитесь, что у вас ЕСТЬ ключ 'hooks:' с отступом
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0  # Или более новая версия, например v1.11.1
    hooks:       # <-- Этот ключ ОБЯЗАТЕЛЬНО должен быть!
      - id: mypy
        # Укажите здесь аргументы для mypy и дополнительные зависимости
        args: [--ignore-missing-imports, --explicit-package-bases]
        # Если нужны дополнительные пакеты типов, перечислите их здесь
        additional_dependencies:
          - "types-PyYAML"
